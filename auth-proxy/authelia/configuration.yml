server:
  address: 'tcp://0.0.0.0:9091/auth'
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  level: info

authentication_backend:
  file:
    path: /config/users.yml
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: deny
  rules:
    - domain_regex: '^.*$'
      policy: bypass
      resources:
        - '^/auth(/.*)?(\?.*)?$'
    - domain_regex: '^.*$'
      subject:
        - "group:midburn-ops-user"
        - "group:midburn-ops-admin"
      resources:
        - '^/(ops|talkies|ai)(/.*)?(\?.*)?$'
      policy: one_factor

session:
  expiration: 1M
  inactivity: 1M
  remember_me: 1M

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
