server:
  address: tcp://0.0.0.0:9091
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  level: info

authentication_backend:
  file:
    path: /config/users.yml
    #watch: true
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: deny
  rules:
    - domain: auth.habak.midburn
      policy: bypass
    - domain: ops.habak.midburn
      subject:
        - "group:midburn-ops-user"
        - "group:midburn-ops-admin"
      policy: one_factor

session:
  cookies:
    - domain: habak.midburn
      authelia_url: https://auth.habak.midburn:8543
      # default_redirection_url: https://app.habak.midburn:8543

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
