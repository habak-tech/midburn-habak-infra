services:
  tls-init:
    image: alpine:3.23
    restart: "no"
    environment:
      TLS_CERT_SAN: ${TLS_CERT_SAN:-DNS:localhost,IP:127.0.0.1}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        umask 077
        if [ ! -s /certs/server.crt ] || [ ! -s /certs/server.key ]; then
          apk add --no-cache openssl
          openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 365 \
            -subj '/CN=Habak self-signed' \
            -addext "subjectAltName=$$TLS_CERT_SAN" \
            -keyout /certs/server.key.tmp -out /certs/server.crt.tmp
          mv /certs/server.key.tmp /certs/server.key
          mv /certs/server.crt.tmp /certs/server.crt
        fi
        cat > /certs/tls.yml <<'EOF'
        tls:
          stores:
            default:
              defaultCertificate:
                certFile: /certs/server.crt
                keyFile: /certs/server.key
        EOF
    volumes:
      - traefik-certs:/certs

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    depends_on:
      tls-init:
        condition: service_completed_successfully
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/certs/tls.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=false
      - --entrypoints.web.http.redirections.entrypoint.to=:${HTTPS_PORT:-8543}
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "${HTTP_PORT:-8181}:80"
      - "${HTTPS_PORT:-8543}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/certs:ro
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.authelia.chain.middlewares=clear-identity,authelia-verify
      - traefik.http.middlewares.clear-identity.headers.customrequestheaders.Remote-User=
      - traefik.http.middlewares.clear-identity.headers.customrequestheaders.Remote-Groups=
      - traefik.http.middlewares.clear-identity.headers.customrequestheaders.Remote-Email=
      - traefik.http.middlewares.clear-identity.headers.customrequestheaders.Remote-Name=
      - traefik.http.routers.home.rule=PathPrefix(`/`)
      - traefik.http.routers.home.priority=1
      - traefik.http.routers.home.entrypoints=websecure
      - traefik.http.routers.home.tls=true
      - traefik.http.routers.home.service=noop@internal
      - traefik.http.routers.home.middlewares=home-redirect
      - traefik.http.middlewares.home-redirect.redirectregex.regex=^https?://.*
      - traefik.http.middlewares.home-redirect.redirectregex.replacement=${CATCH_ALL_REDIRECT_URL:-/ops/}
      - traefik.http.middlewares.home-redirect.redirectregex.permanent=false
      - traefik.http.middlewares.authelia-verify.forwardauth.address=http://authelia:9091/auth/api/authz/forward-auth
      - traefik.http.middlewares.authelia-verify.forwardauth.trustForwardHeader=false
      - traefik.http.middlewares.authelia-verify.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Email,Remote-Name
    networks:
      - authproxy

  authelia:
    image: authelia/authelia:4.39
    command:
      - authelia
      - --config=/config/configuration.yml
      - --config=/config/session.yml
    restart: unless-stopped
    volumes:
      - ./authelia:/config
      - ./authelia/secrets:/secrets:ro
    environment:
      TZ: Asia/Jerusalem
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/JWT_SECRET
      AUTHELIA_SESSION_SECRET_FILE: /secrets/SESSION_SECRET
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/STORAGE_ENCRYPTION_KEY
    networks:
      - authproxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.authelia.rule=Path(`/auth`) || PathPrefix(`/auth/`)
      - traefik.http.routers.authelia.entrypoints=websecure
      - traefik.http.routers.authelia.tls=true
      - traefik.http.services.authelia.loadbalancer.server.port=9091

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    restart: unless-stopped
    profiles:
      - cloudflare
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - traefik
    networks:
      - authproxy

volumes:
  traefik-certs:

networks:
  authproxy:
    name: midburn-habak-auth-proxy
    external: true
