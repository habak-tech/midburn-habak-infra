services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=false
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/authz/forward-auth
      - traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=false
      - traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Email,Remote-Name
    networks:
      - authproxy

  authelia:
    image: authelia/authelia:4.39
    restart: unless-stopped
    volumes:
      - ./authelia:/config
      - ./authelia/secrets:/secrets:ro
    environment:
      TZ: Asia/Jerusalem
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTH_HOSTNAME: ${AUTH_HOSTNAME:-auth.habak.midburn}
      APP_HOSTNAME: ${APP_HOSTNAME:-ops.habak.midburn}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-habak.midburn}
      AUTH_PORTAL_URL: ${AUTH_PORTAL_URL:-https://auth.habak.midburn:8543}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/JWT_SECRET
      AUTHELIA_SESSION_SECRET_FILE: /secrets/SESSION_SECRET
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/STORAGE_ENCRYPTION_KEY
    networks:
      - authproxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.authelia.rule=Host(`${AUTH_HOSTNAME:-auth.habak.midburn}`)
      - traefik.http.routers.authelia.entrypoints=websecure
      - traefik.http.routers.authelia.tls=true
      - traefik.http.services.authelia.loadbalancer.server.port=9091

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    restart: unless-stopped
    profiles:
      - cloudflare
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - traefik
    networks:
      - authproxy

networks:
  authproxy:
    name: midburn-habak-auth-proxy
    external: true
