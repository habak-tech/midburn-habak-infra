name: build and push
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: "e.g. midburn-ops-log / midburn-habak-ai"
      image_suffix:
        required: true
        type: string
        description: "e.g. app / db"
      docker_context:
        required: false
        type: string
        default: "."
      docker_file:
        required: false
        type: string
        default: "Dockerfile"
      docker_target:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/habak-tech/${{ github.event.inputs.image_name }}-${{ github.event.inputs.image_suffix }}

concurrency:
  group: ${{ github.event.inputs.image_suffix }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            cache-scope: ${{ github.event.inputs.image_suffix }}-linux-amd64
            artifact: ${{ github.event.inputs.image_suffix }}-linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-scope: ${{ github.event.inputs.image_suffix }}-linux-arm64
            artifact: ${{ github.event.inputs.image_suffix }}-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.event.inputs.docker_context }}
          file: ${{ github.event.inputs.docker_file }}
          target: ${{ github.event.inputs.docker_target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.event.inputs.image_suffix }}-linux-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Create multi-platform manifest
        working-directory: /tmp/digests
        run: |
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:${GITHUB_SHA}" \
            --tag "$IMAGE:latest" \
            "${sources[@]}"
